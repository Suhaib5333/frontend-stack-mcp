name: Feature request
description: Suggest a new check, option or pipeline change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool or pipeline do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
