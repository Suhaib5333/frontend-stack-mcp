name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Tool call arguments and, if possible, a public URL or minimal HTML page.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Claude Desktop, Cursor, VS Code
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node version, Playwright browser or channel
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
